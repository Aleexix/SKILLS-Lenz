# Cada push a main que toca skills/ valida el catálogo y actualiza index.json.
# En un pull request solo valida (no escribe).
name: Catálogo

on:
  push:
    branches: [main]
    paths: ["skills/**", "scripts/**", ".github/workflows/index.yml"]
  pull_request:
    paths: ["skills/**", "scripts/**", ".github/workflows/index.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar y armar index.json
        run: node scripts/build-index.mjs

      - name: Subir index.json si cambió
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: actualizar index.json"
          git push
